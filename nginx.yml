- name: Install and start nginx
  hosts: all
  become: true
  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Ensure nginx is running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Custom homepage
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: "<h1>Deployed by AWX on {{ inventory_hostname }}</h1>\n"
